<rect x="353.0" y="702" width="62" height="40" rx="11" fill="#0c0d10"/>
<rect x="481.0" y="702" width="62" height="40" rx="11" fill="#0c0d10"/>
<rect x="609.0" y="702" width="62" height="40" rx="11" fill="#0c0d10"/>
<rect x="737.0" y="702" width="62" height="40" rx="11" fill="#0c0d10"/>
<rect x="865.0" y="702" width="62" height="40" rx="11" fill="#0c0d10"/>
<rect x="258" y="340" width="508" height="344" rx="22" fill="#050506"/>
<g filter="url(#blur)" opacity="0.55" style="mix-blend-mode:screen;isolation:isolate">
<circle cx="512.0" cy="464.0" r="104" fill="#ff2d2d" style="mix-blend-mode:screen"/>
<circle cx="564.0" cy="554.0" r="104" fill="#2dff5a" style="mix-blend-mode:screen"/>
