<!-- TetherInvert logo. An orange colour negative on the copy stand; in its frame the red, green and
     blue exposures TetherInvert takes, merging to white. 1024 x 1024, macOS icon grid (824 px squircle). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<clipPath id="sq">
<rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a2e36"/>
<stop offset="1" stop-color="#090a0d"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f59a48"/>
<stop offset="0.5" stop-color="#d9692a"/>
<stop offset="1" stop-color="#a8461a"/></linearGradient>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="34"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity="0.35"/></filter>
<filter id="inset">
<feOffset dy="4"/>
<feGaussianBlur stdDeviation="4"/>
<feComposite operator="out" in="SourceGraphic"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.7"/></feComponentTransfer>
<feBlend in2="SourceGraphic"/></filter>
</defs>
<g filter="url(#shadow)">
<g clip-path="url(#sq)">
<rect width="1024" height="1024" fill="url(#dark)"/>
<g transform="rotate(-9 512 512)">
<rect x="-200" y="262" width="1424" height="500" fill="url(#amber)"/>
<rect x="-200" y="262" width="1424" height="3" fill="#ffd2a6" opacity="0.5"/>
<rect x="97.0" y="282" width="62" height="40" rx="11" fill="#0c0d10"/>
