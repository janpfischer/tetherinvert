[project]
name = "tetherinvert"
version = "0.1.0"
description = "Tethered film scanning with a Scanlight, straight to 16-bit TIFF."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rawpy>=0.21",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "opencv-python-headless>=4.8",
    "pyserial>=3.5",
    "gphoto2>=2.5; sys_platform != 'win32'",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "lupa>=2.2"]  # lupa runs the Lightroom plug-in's Lua in the tests

[project.scripts]
tetherinvert = "tetherinvert.cli:main"

[build-system]
requires = ["setuptools>=77"]  # 77 reads the SPDX licence expression
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tetherinvert", "tetherinvert.window"]

[tool.setuptools.package-data]
tetherinvert = ["tetherinvert.lrplugin/*.lua"]
"tetherinvert.window" = ["fonts/*.ttf", "fonts/*.txt"]  # Instrument Sans and IBM Plex Mono, with their licences (SIL OFL 1.1)

[tool.pytest.ini_options]
testpaths = ["tests"]
